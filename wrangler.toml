name = "wa-blast"
main = "./dist/server/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static files (CSS, JS, images) produced by the build.
[assets]
directory = "./dist/client"
binding = "ASSETS"

# Non-secret variables can live here. Secrets (service role key, cron secret)
# must be added with `wrangler secret put ...` or in the Cloudflare dashboard.
[vars]
# MY_SUPABASE_URL = "https://xxxx.supabase.co"
# MY_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_xxx"
